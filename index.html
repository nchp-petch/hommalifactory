<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hommali Factory — สั่งเครื่องดื่ม</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --husk:#231d17;
    --husk-2:#2c241b;
    --surface:#332a1f;
    --surface-2:#3d3225;
    --paddy:#8a9a5f;
    --paddy-dark:#6a7a45;
    --jasmine:#efe4c8;
    --jasmine-dim:#cabf9e;
    --gold:#cda24d;
    --clay:#b4703c;
    --danger:#c0604a;
    --line-blue:#06c755;
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--husk);
    color:var(--jasmine);
    font-family:'Noto Sans Thai',sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  #phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:linear-gradient(180deg,var(--husk-2),var(--husk));
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  h1,h2,h3{font-family:'Noto Serif Thai',serif; margin:0;}
  ::-webkit-scrollbar{display:none;}

  /* ---- top bar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 12px;
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,var(--husk-2) 70%,transparent);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--gold),var(--paddy-dark));
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }
  .brand-text h1{font-size:15px;color:var(--jasmine);letter-spacing:.3px;}
  .brand-text span{font-size:10px;color:var(--jasmine-dim);letter-spacing:1.5px;text-transform:uppercase;}
  .admin-toggle{
    background:var(--surface);border:1px solid #4a3f2e;color:var(--jasmine-dim);
    width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer;
  }
  .admin-toggle.active{background:var(--gold);color:var(--husk);border-color:var(--gold);}

  /* ---- content ---- */
  .content{flex:1; padding:4px 18px 100px; overflow-y:auto;}
  .section-title{font-size:19px;color:var(--jasmine);margin:14px 0 4px;}
  .section-sub{font-size:12px;color:var(--jasmine-dim);margin-bottom:16px;}

  /* ---- login ---- */
  .login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px;text-align:center;gap:18px;}
  .grain-hero{font-size:52px;line-height:1;}
  .login-wrap h1{font-size:24px;}
  .login-wrap p{font-size:13px;color:var(--jasmine-dim);max-width:280px;line-height:1.7;}
  .line-btn{
    background:var(--line-blue); color:#fff; border:none; border-radius:999px;
    padding:14px 28px; font-size:15px; font-weight:600; font-family:inherit;
    display:flex; align-items:center; gap:10px; cursor:pointer; box-shadow:0 6px 18px rgba(6,199,85,.35);
  }
  .field{width:100%;max-width:280px;text-align:left;margin-top:6px;}
  .field label{font-size:11px;color:var(--jasmine-dim);display:block;margin-bottom:5px;}
  .field input{
    width:100%;padding:11px 13px;border-radius:var(--radius-sm);border:1px solid #4a3f2e;
    background:var(--surface); color:var(--jasmine); font-family:inherit; font-size:14px;
  }
  .field input:focus{outline:2px solid var(--gold);}
  .primary-btn{
    width:100%;max-width:280px;padding:13px;border:none;border-radius:999px;
    background:var(--gold); color:var(--husk); font-weight:700; font-size:14px;
    font-family:inherit; cursor:pointer; margin-top:8px;
  }
  .primary-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---- drink grid ---- */
  .drink-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .drink-card{
    background:var(--surface); border-radius:var(--radius); padding:14px;
    border:1px solid #453a29; cursor:pointer; transition:.15s;
  }
  .drink-card:active{transform:scale(.97);}
  .drink-emoji{font-size:26px;margin-bottom:8px;}
  .drink-name{font-size:13.5px;font-weight:600;line-height:1.3;color:var(--jasmine);}
  .drink-name-en{font-size:10px;color:var(--jasmine-dim);margin-top:2px;}
  .drink-price{font-size:13px;color:var(--gold);margin-top:8px;font-weight:700;}

  /* ---- modal ---- */
  .overlay{
    position:absolute;inset:0;background:rgba(15,12,8,.72);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    width:100%;max-width:430px;background:var(--husk-2);
    border-radius:22px 22px 0 0;padding:22px 20px 26px;
    max-height:88vh;overflow-y:auto;
    animation:slideup .22s ease-out;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .close-x{background:none;border:none;color:var(--jasmine-dim);font-size:20px;cursor:pointer;}
  .option-label{font-size:12px;color:var(--jasmine-dim);margin:16px 0 8px;letter-spacing:.3px;}
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;}
  .pill{
    padding:9px 16px;border-radius:999px;border:1px solid #4a3f2e;background:var(--surface);
    color:var(--jasmine-dim);font-size:13px;cursor:pointer;font-family:inherit;
  }
  .pill.selected{background:var(--paddy);border-color:var(--paddy);color:#1a1f10;font-weight:700;}

  /* sweetness dropdown */
  .select-box{position:relative;width:100%;}
  .select-box select{
    width:100%; appearance:none; -webkit-appearance:none;
    background:var(--surface); border:1px solid #4a3f2e; border-radius:var(--radius-sm);
    color:var(--jasmine); font-family:inherit; font-size:15px; font-weight:600;
    padding:13px 40px 13px 14px; cursor:pointer;
  }
  .select-box::after{
    content:'▾'; position:absolute; right:14px; top:50%; transform:translateY(-50%);
    color:var(--gold); font-size:14px; pointer-events:none;
  }
  .select-box select:focus{outline:2px solid var(--gold);}

  .qty-row{display:flex;align-items:center;gap:16px;margin-top:16px;}
  .qty-btn{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid #4a3f2e;color:var(--jasmine);font-size:16px;cursor:pointer;}
  .qty-val{font-size:16px;font-weight:700;min-width:20px;text-align:center;}
  .sheet-total{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:14px;border-top:1px dashed #4a3f2e;}
  .sheet-total .amt{font-size:20px;color:var(--gold);font-weight:700;}

  /* ---- bottom nav ---- */
  .bottomnav{
    position:absolute; bottom:0; left:0; right:0; z-index:20;
    background:var(--husk-2); border-top:1px solid #4a3f2e;
    display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1; background:none; border:none; color:var(--jasmine-dim);
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px;
    padding:6px 2px; cursor:pointer; font-family:inherit; position:relative;
  }
  .nav-btn.active{color:var(--gold);}
  .nav-icon{font-size:18px;}
  .nav-badge{
    position:absolute; top:2px; right:22%; background:var(--danger); color:#fff;
    font-size:9px; border-radius:999px; padding:1px 5px; font-weight:700;
  }

  /* ---- address / map ---- */
  #map{height:230px;border-radius:var(--radius);overflow:hidden;margin-top:6px;border:1px solid #453a29;}
  .addr-hint{font-size:11px;color:var(--jasmine-dim);margin-top:8px;line-height:1.6;}
  .addr-card{
    background:var(--surface);border-radius:var(--radius-sm);padding:12px 14px;margin-top:10px;
    border:1px solid #453a29; display:flex; justify-content:space-between; align-items:center;
  }
  .addr-card.selected{border-color:var(--paddy); background:#3a3f27;}
  .addr-card .label{font-size:13px;font-weight:600;}
  .addr-card .detail{font-size:10.5px;color:var(--jasmine-dim);margin-top:3px;}
  .tag-btn{background:none;border:1px solid var(--paddy);color:var(--paddy);border-radius:999px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:inherit;}

  /* ---- cart ---- */
  .cart-item{display:flex;gap:12px;background:var(--surface);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;border:1px solid #453a29;}
  .cart-item .ci-emoji{font-size:24px;}
  .cart-item .ci-info{flex:1;}
  .cart-item .ci-name{font-size:13px;font-weight:600;}
  .cart-item .ci-meta{font-size:10.5px;color:var(--jasmine-dim);margin-top:3px;line-height:1.5;}
  .cart-item .ci-price{font-size:13px;color:var(--gold);font-weight:700;}
  .remove-link{background:none;border:none;color:var(--danger);font-size:10.5px;cursor:pointer;margin-top:6px;padding:0;font-family:inherit;}
  .summary-row{display:flex;justify-content:space-between;font-size:13px;color:var(--jasmine-dim);margin-bottom:6px;}
  .summary-row.total{color:var(--jasmine);font-weight:700;font-size:15px;border-top:1px dashed #4a3f2e;padding-top:10px;margin-top:6px;}

  /* ---- checkout / payment ---- */
  .qr-box{background:#fff;border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:8px;}
  .qr-box svg{width:160px;height:160px;}
  .qr-box .acc{color:#333;font-size:11px;text-align:center;line-height:1.6;}
  .upload-box{
    border:1.5px dashed #5a4d38; border-radius:var(--radius); padding:22px;
    text-align:center; margin-top:14px; cursor:pointer; background:var(--surface);
  }
  .upload-box img{max-width:100%;max-height:180px;border-radius:10px;margin-top:10px;}
  .upload-box .up-icon{font-size:26px;}
  .upload-box p{font-size:12px;color:var(--jasmine-dim);margin-top:6px;}

  /* ---- orders ---- */
  .order-card{background:var(--surface);border-radius:var(--radius);padding:15px;margin-bottom:14px;border:1px solid #453a29;}
  .order-head{display:flex;justify-content:space-between;align-items:flex-start;}
  .order-id{font-size:12px;color:var(--jasmine-dim);}
  .order-status-pill{font-size:11px;padding:4px 10px;border-radius:999px;font-weight:700;}
  .grain-track{display:flex;gap:5px;margin:14px 0 8px;}
  .grain{font-size:16px;opacity:.25;transition:.2s;}
  .grain.filled{opacity:1;}
  .stage-label{font-size:11px;color:var(--jasmine-dim);}
  .order-items{font-size:11.5px;color:var(--jasmine-dim);margin-top:10px;line-height:1.7;}

  /* ---- toast (LINE-style push notification) ---- */
  .toast{
    position:absolute; top:14px; left:14px; right:14px; z-index:100;
    background:#1e1e1e; border-radius:14px; padding:12px 14px; display:flex; gap:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.4); border:1px solid #06c75555;
    animation:toastin .25s ease-out;
  }
  @keyframes toastin{from{transform:translateY(-16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .toast .t-icon{width:30px;height:30px;border-radius:8px;background:var(--line-blue);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .toast .t-title{font-size:11.5px;color:#8fd; font-weight:700;}
  .toast .t-body{font-size:12px;color:#eee;margin-top:2px;line-height:1.4;}

  /* ---- admin ---- */
  .admin-order{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:12px;border:1px solid #453a29;}
  .admin-btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .admin-btn{flex:1;min-width:100px;padding:9px;border-radius:999px;border:none;background:var(--paddy);color:#182010;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .admin-btn.secondary{background:var(--surface-2);color:var(--jasmine-dim);border:1px solid #4a3f2e;}
  .slip-thumb{width:100%;border-radius:10px;margin-top:8px;max-height:160px;object-fit:cover;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--jasmine-dim);}
  .empty-state .ee{font-size:34px;margin-bottom:10px;}
</style>
</head>
<body>
<div id="phone">
  <div id="toast-layer"></div>
  <div id="app"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===================== DATA ===================== */
// prices is keyed by temperature — one price per ร้อน/เย็น option a drink offers.
// Drinks with only one key (e.g. เย็น only) are single-temp and skip the temp picker.
// roasts / beans are OPTIONAL and only apply to coffee-based drinks:
//   roasts: array of roast levels, no price change, e.g. ['อ่อน','กลาง','เข้ม']
//   beans:  object of bean choice -> price add-on, e.g. {'เบลนด์ร้านประจำ':0,'สิงเกิลออริจิน':15}
// Drinks without `roasts`/`beans` simply won't show those pickers (e.g. matcha, ชาไทย).
const DRINKS = [
  {id:'d1', name:'จัสมินไรซ์ลาเต้', en:'Jasmine Rice Latte', emoji:'🍚', prices:{'ร้อน':75,'เย็น':85},
    roasts:['อ่อน','กลาง','เข้ม'], beans:{'เบลนด์ร้านประจำ':0,'สิงเกิลออริจิน':15}},
  {id:'d2', name:'ข้าวคั่วโฮจิฉะลาเต้', en:'Roasted Rice Houjicha', emoji:'🍵', prices:{'ร้อน':85,'เย็น':95}},
  {id:'d3', name:'มัทฉะข้าวหอมมะลิ', en:'Jasmine Rice Matcha', emoji:'🍃', prices:{'ร้อน':85,'เย็น':95}},
  {id:'d4', name:'อเมริกาโนข้าวหอม', en:'Rice-Infused Americano', emoji:'☕', prices:{'ร้อน':55,'เย็น':65},
    roasts:['อ่อน','กลาง','เข้ม'], beans:{'เบลนด์ร้านประจำ':0,'สิงเกิลออริจิน':15}},
  {id:'d5', name:'คาปูชิโนข้าวคั่ว', en:'Toasted Rice Cappuccino', emoji:'🫘', prices:{'ร้อน':80},
    roasts:['กลาง','เข้ม'], beans:{'เบลนด์ร้านประจำ':0,'สิงเกิลออริจิน':15}},
  {id:'d6', name:'ชาไทยข้าวหอมมะลิ', en:'Jasmine Rice Thai Tea', emoji:'🧋', prices:{'ร้อน':60,'เย็น':70}},
  {id:'d7', name:'น้ำข้าวหอมมะลิเย็น', en:'Cold Jasmine Rice Milk', emoji:'🥛', prices:{'เย็น':60}},
  {id:'d8', name:'เอสเพรสโซ่โทนิคข้าว', en:'Rice Espresso Tonic', emoji:'🥃', prices:{'เย็น':85},
    roasts:['กลาง','เข้ม'], beans:{'เบลนด์ร้านประจำ':0,'สิงเกิลออริจิน':15}},
];
const SWEET_OPTIONS = ['0%','25%','50%','75%','100%','100+%'];
const TIME_SLOTS = ['10:00','11:00','12:00','13:00','14:00','15:00'];
const STAGES = [
  {k:'slip_review', label:'รอตรวจสอบสลิป', color:'#cda24d'},
  {k:'confirmed', label:'ยืนยันชำระเงินแล้ว', color:'#8a9a5f'},
  {k:'preparing', label:'กำลังเตรียมเครื่องดื่ม', color:'#8a9a5f'},
  {k:'ready', label:'พร้อมส่ง / พร้อมรับ', color:'#8a9a5f'},
  {k:'completed', label:'จัดส่งสำเร็จ', color:'#6a7a45'},
];

/* ===================== STATE ===================== */
let state = {
  profile: null,          // {name, phone}
  view: 'login',          // login | menu | address | cart | orders
  isAdmin: false,
  addresses: [],
  selectedAddressId: null,
  selectedTimeSlot: null,
  cart: [],
  orders: [],
  modalDrink: null,       // drink customization sheet
  pendingPin: null,       // {lat,lng} chosen on map, not yet saved
  checkoutSlip: null,     // base64 image while composing an order
};
let mapInstance = null, mapMarker = null;
let orderCounter = 1000;

/* ===================== STORAGE (shared shop backend demo) ===================== */
async function loadOrders(){
  try{
    const res = await window.storage.get('hommali:orders', true);
    if(res && res.value) state.orders = JSON.parse(res.value);
  }catch(e){ /* no orders yet */ }
}
async function saveOrders(){
  try{ await window.storage.set('hommali:orders', JSON.stringify(state.orders), true); }
  catch(e){ console.error('storage save failed', e); }
}

/* ===================== HELPERS ===================== */
function money(n){ return n.toLocaleString('th-TH',{minimumFractionDigits:0}); }
function priceRangeLabel(d){
  const vals = Object.values(d.prices);
  const beanAdd = d.beans ? Math.max(...Object.values(d.beans)) : 0;
  const min = Math.min(...vals), max = Math.max(...vals) + beanAdd;
  return min===max ? `${money(min)} บาท` : `${money(min)}–${money(max)} บาท`;
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function unitPrice(drink, draft){
  return drink.prices[draft.temp] + (drink.beans ? drink.beans[draft.bean] : 0);
}
function itemOptionsLabel(i){
  const parts = [i.temp];
  if(i.roast) parts.push(`คั่ว${i.roast}`);
  if(i.bean) parts.push(i.bean);
  parts.push(`หวาน ${i.sweet}`);
  return parts.join(' · ');
}
function showToast(title, body){
  const layer = document.getElementById('toast-layer');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<div class="t-icon">🔔</div><div><div class="t-title">${title}</div><div class="t-body">${body}</div></div>`;
  layer.appendChild(t);
  setTimeout(()=>{ t.style.transition='.3s'; t.style.opacity='0'; t.style.transform='translateY(-10px)'; setTimeout(()=>t.remove(),300); }, 3400);
}

/* ===================== RENDER ROOT ===================== */
function render(){
  const app = document.getElementById('app');
  if(!state.profile){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }

  let body = '';
  if(state.isAdmin){ body = renderAdmin(); }
  else {
    if(state.view==='menu') body = renderMenu();
    else if(state.view==='address') body = renderAddress();
    else if(state.view==='cart') body = renderCart();
    else if(state.view==='orders') body = renderOrders();
  }

  app.innerHTML = `
    ${renderTopbar()}
    <div class="content">${body}</div>
    ${state.isAdmin ? '' : renderBottomNav()}
    ${state.modalDrink ? renderDrinkSheet(state.modalDrink) : ''}
  `;
  attachGlobalEvents();
  if(state.view==='address' && !state.isAdmin) setTimeout(initMap, 0);
  if(state.modalDrink) attachSheetEvents();
}

function renderTopbar(){
  return `
  <div class="topbar">
    <div class="brand">
      <div class="mark">🌾</div>
      <div class="brand-text">
        <h1>Hommali Factory</h1>
        <span>${state.isAdmin ? 'จอร้านค้า · Staff' : 'สวัสดี ' + escapeHtml(state.profile.name)}</span>
      </div>
    </div>
    <button class="admin-toggle ${state.isAdmin?'active':''}" id="toggle-admin" title="สลับมุมมองร้านค้า">⚙️</button>
  </div>`;
}

function renderBottomNav(){
  const pendingCount = state.orders.filter(o=>o.memberPhone===state.profile.phone && o.status!=='completed').length;
  const items = [
    {k:'menu', icon:'🍵', label:'เมนู'},
    {k:'address', icon:'📍', label:'ที่อยู่'},
    {k:'cart', icon:'🧺', label:'ตะกร้า', badge: state.cart.length||null},
    {k:'orders', icon:'🧾', label:'ออเดอร์', badge: pendingCount||null},
  ];
  return `<div class="bottomnav">
    ${items.map(i=>`
      <button class="nav-btn ${state.view===i.k?'active':''}" data-nav="${i.k}">
        ${i.badge?`<span class="nav-badge">${i.badge}</span>`:''}
        <span class="nav-icon">${i.icon}</span>${i.label}
      </button>`).join('')}
  </div>`;
}

/* ===================== LOGIN ===================== */
function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="grain-hero">🌾☕</div>
    <h1>Hommali Factory</h1>
    <p>สั่งเครื่องดื่มและชำระเงินผ่านระบบสไตล์ LINE — ลงทะเบียน ปักหมุดที่อยู่ เลือกเมนู แนบสลิป และรับแจ้งเตือนสถานะออเดอร์แบบเรียลไทม์</p>
    <button class="line-btn" id="line-login">💬 เข้าสู่ระบบด้วย LINE</button>
    <div id="reg-fields" style="display:none; margin-top:6px; display:flex; flex-direction:column; align-items:center; gap:10px;">

function initMap(){
  const mapEl = document.getElementById('map');
  if(!mapEl) return;
  const center = state.addresses[0] ? [state.addresses[0].lat, state.addresses[0].lng] : [14.8818, 103.4936]; // Surin, TH
  mapInstance = L.map('map', {zoomControl:false}).setView(center, 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap'}).addTo(mapInstance);
  L.control.zoom({position:'bottomright'}).addTo(mapInstance);
  state.addresses.forEach(a=> L.marker([a.lat,a.lng]).addTo(mapInstance));

  function dropPinAt(lat, lng, zoom){
    state.pendingPin = {lat, lng};
    if(mapMarker) mapInstance.removeLayer(mapMarker);
    mapMarker = L.marker([lat,lng]).addTo(mapInstance);
    mapInstance.setView([lat,lng], zoom || mapInstance.getZoom());
    document.getElementById('pin-save-row').style.display = 'flex';
    document.getElementById('pin-coords').textContent = `ตำแหน่งที่เลือก: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  }

  mapInstance.on('click', (e)=> dropPinAt(e.latlng.lat, e.latlng.lng));

  document.getElementById('use-gps')?.addEventListener('click', ()=>{
    if(!navigator.geolocation){ alert('อุปกรณ์นี้ไม่รองรับการระบุตำแหน่ง GPS'); return; }
    const btn = document.getElementById('use-gps');
    btn.textContent = '📡 กำลังค้นหาตำแหน่ง...';
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        btn.textContent = '📡 ใช้ตำแหน่งปัจจุบัน (GPS)';
        dropPinAt(pos.coords.latitude, pos.coords.longitude, 17);
      },
      (err)=>{
        btn.textContent = '📡 ใช้ตำแหน่งปัจจุบัน (GPS)';
        alert('ไม่สามารถระบุตำแหน่งได้ กรุณาอนุญาตการเข้าถึงตำแหน่ง หรือปักหมุดเองบนแผนที่');
      },
      {enableHighAccuracy:true, timeout:10000}
    );
  });

  document.getElementById('save-pin')?.addEventListener('click', ()=>{
    const label = document.getElementById('addr-label').value.trim() || 'ที่อยู่ใหม่';
    const detail = document.getElementById('addr-detail').value.trim();
    if(!state.pendingPin) return;
    const newAddr = {id:uid(), label, detail, lat:state.pendingPin.lat, lng:state.pendingPin.lng};
    state.addresses.push(newAddr);
    if(!state.selectedAddressId) state.selectedAddressId = newAddr.id;
    state.pendingPin = null;
    render();
  });
}

function fakeQR(){
  // deterministic pseudo-QR pattern, purely decorative
  let cells='';
  let seed=42;
  function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  for(let y=0;y<10;y++) for(let x=0;x<10;x++){
    if(rnd()>0.5) cells+=`<rect x="${x*10}" y="${y*10}" width="9" height="9" fill="#111"/>`;
  }
  return cells + `<rect x="0" y="0" width="24" height="24" fill="none" stroke="#111" stroke-width="4"/><rect x="76" y="0" width="24" height="24" fill="none" stroke="#111" stroke-width="4"/><rect x="0" y="76" width="24" height="24" fill="none" stroke="#111" stroke-width="4"/>`;
}

    };

    render();
  });

  });

    state.selectedAddressId = b.dataset.selectAddr;
    render();
  });
  document.querySelectorAll('[data-timeslot]').forEach(b=> b.onclick = ()=>{
    state.selectedTimeSlot = b.dataset.timeslot;
    render();
  });
  const checkoutBtn = document.getElementById('go-checkout');
  if(checkoutBtn) checkoutBtn.onclick = ()=>{ state.checkoutOpen = true; state.checkoutSlip=null; render(); };

  const closeCheckout = document.getElementById('close-checkout');
  if(closeCheckout) closeCheckout.onclick = ()=>{ state.checkoutOpen=false; render(); };
  const co = document.getElementById('checkout-overlay');
  if(co) co.onclick = (e)=>{ if(e.target.id==='checkout-overlay'){ state.checkoutOpen=false; render(); } };

  const uploadBox = document.getElementById('upload-box');
  if(uploadBox) uploadBox.onclick = ()=> document.getElementById('slip-input').click();
  const slipInput = document.getElementById('slip-input');
  if(slipInput) slipInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ state.checkoutSlip = reader.result; render(); };
    reader.readAsDataURL(file);
  };
  const submitOrder = document.getElementById('submit-order');
  if(submitOrder) submitOrder.onclick = async ()=>{
    const subtotal = state.cart.reduce((s,i)=>s+i.unitPrice*i.qty,0) + 20;
    orderCounter++;
    const order = {
      id: uid(), num: orderCounter,
      memberName: state.profile.name, memberPhone: state.profile.phone,
      addressId: state.selectedAddressId, timeSlot: state.selectedTimeSlot,
      items: state.cart, total: subtotal,
      slip: state.checkoutSlip, status: 'slip_review', createdAt: Date.now()
    };
    state.orders.push(order);
    await saveOrders();
    state.cart = [];
    state.checkoutOpen = false;
    state.checkoutSlip = null;
    state.selectedTimeSlot = null;
    state.view = 'orders';
    render();
    showToast('Hommali Factory', `รับคำสั่งซื้อ #${order.num} แล้ว กำลังตรวจสอบสลิปการโอนเงิน`);
  };

  document.querySelectorAll('[data-advance]').forEach(b=> b.onclick = async ()=>{
    const order = state.orders.find(o=>o.id===b.dataset.advance);
    const idx = STAGES.findIndex(s=>s.k===order.status);
    if(idx < STAGES.length-1){
      order.status = STAGES[idx+1].k;
      await saveOrders();
      render();
      showToast('แจ้งเตือนถึงลูกค้า (LINE)', `ออเดอร์ #${order.num}: ${STAGES[idx+1].label}`);
    }
  });
  document.querySelectorAll('[data-view-map]').forEach(b=> b.onclick = ()=>{
    const addr = state.addresses.find(a=>a.id===b.dataset.viewMap);
    if(addr) alert(`${addr.label}\n${addr.detail || ''}\nพิกัดแน่นอน: ${addr.lat.toFixed(6)}, ${addr.lng.toFixed(6)}`);
    else alert('ไม่พบข้อมูลที่อยู่');
  });
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

render();
</script>
</body>
</html>
